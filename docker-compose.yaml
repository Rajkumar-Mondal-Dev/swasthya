version: '3.5'

services:
  ##########
  # Database
  ##########
  swasthya-postgres:
    container_name: swasthya-postgres
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      PGDATA: /data/postgres
    volumes:
      - ./.data/postgres:/data/postgres
    ports:
      - "5432:5432"

  ##########
  # Backend
  ##########
  swasthya-backend:
    container_name: swasthya-backend
    image: swasthya-backend
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: swasthya-backend
    ports:
      - "5000:5000"
    volumes:
      - ./apps/backend/src:/opt/app/backend/src
      - ./apps/backend/prisma:/opt/app/backend/prisma
    environment:
      POSTGRES_HOST: swasthya-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: swasthyadb
      DATABASE_URL: postgresql://postgres:password@localhost:5432/swasthyadb?schema=public
    depends_on:
      - swasthya-postgres 

  ##########
  # Frontend
  ##########
  swasthya-frontend:
    container_name: swasthya-frontend
    image: swasthya-frontend
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: swasthya-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend/app:/opt/app/frontend/app

volumes:
  postgres:
  swasthya-backend:
  swasthya-frontend:
  # pgadmin: